[package]
name = "nexora"
version = "0.1.0"
description = "NEXORA AI - Autonomous Local-First Multi-Agent Intelligence System"
authors = ["NEXORA Core Team"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "nexora_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
neo4rs = { version = "0.8", default-features = false, optional = true }
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
thiserror = "2.0"
log = "0.4"
regex = "1.11"
dirs = "6.0"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.17"

[features]
default = []
neo4j = ["dep:neo4rs"]
